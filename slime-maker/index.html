<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スライム生成エンジン 試作 v0.1</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0d1526; color:#dfe8ff; font-family: system-ui, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 40px; }
  @font-face { font-family:"HP Denki"; src:url("../assets/denki-chip/x8y12pxDenkiChip.woff2") format("woff2"); }
  h1 { font-family:"HP Denki", sans-serif; font-size: 24px; margin: 4px 0 2px; }
  .sub { color:#8fa5cc; font-size: 13px; margin-bottom: 14px; }
  canvas { display:block; width:100%; background:#101c36; border:1px solid #26355a; border-radius:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin: 14px 0 8px; }
  button { background:#1d2c4f; color:#dfe8ff; border:1px solid #3a5080; border-radius:999px;
           padding:7px 14px; font-size:13px; cursor:pointer; }
  button:hover { background:#27396a; }
  label { font-size:13px; color:#8fa5cc; display:block; margin:12px 0 6px; }
  textarea { width:100%; box-sizing:border-box; height:170px; background:#0a1120; color:#b9fbc0;
             border:1px solid #26355a; border-radius:8px; padding:10px; font-family: ui-monospace, monospace; font-size:12.5px; }
  .note { color:#8fa5cc; font-size:12.5px; line-height:1.7; margin-top:12px; }
  #err { color:#ff9d9d; font-size:12.5px; min-height:1em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>スライム生成エンジン 試作 v0.1</h1>
  <div class="sub">設定（テキスト）を受け取って、エンジンがスライムを描いて動かす。キャラ生成と呼べるのは、スライム以外の形も作れるようになってから。</div>
  <canvas id="cv" width="840" height="360"></canvas>
  <div class="row" id="presets"></div>
  <label for="settings">設定テキスト（このテキストが「キャラの作り方」。書き換えて「反映」を押すと姿が変わります）</label>
  <textarea id="settings" spellcheck="false"></textarea>
  <div id="err"></div>
  <div class="row"><button id="apply">反映する</button></div>
  <label for="slimeUrl">このスライムのURL（設定がURLに入っています。ゲーム「bakudanslim」の主役定義に貼ると、そのスライムが主役になります）</label>
  <div class="row" style="align-items:center;">
    <input id="slimeUrl" readonly style="flex:1;min-width:260px;background:#0a1120;color:#b9fbc0;border:1px solid #26355a;border-radius:8px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;">
    <button id="copyUrl">URLをコピー</button>
  </div>
  <div class="note">
    設定の項目: name（名前）／ color（体の色）／ belly（お腹の色）／ scale（大きさ）／ wide（横幅の比率）／
    eye（目の種類: normal・happy・sleepy）／ mouth（口: smile・o・flat）／ pattern（模様: none・spots・stripes）／
    seed（模様の配置を決める数）／ hop（跳ねる高さ）
  </div>
</div>
<script>
"use strict";
// ---- 小さな乱数（seed から決定的に） ----
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const PRESETS = [
 {name:"みどりスライム", color:"#4fd24f", belly:"#b9fbc0", scale:1.0, wide:1.15, eye:"normal", mouth:"smile", pattern:"none", seed:7, hop:1.0},
 {name:"うみスライム", color:"#3f9de0", belly:"#cfeeff", scale:0.92, wide:1.05, eye:"happy", mouth:"o", pattern:"spots", seed:21, hop:1.3},
 {name:"ももスライム", color:"#f78fb8", belly:"#ffe3ef", scale:0.85, wide:1.25, eye:"normal", mouth:"smile", pattern:"stripes", seed:3, hop:0.8},
 {name:"きんスライム", color:"#f5b921", belly:"#ffedb5", scale:1.25, wide:1.2, eye:"sleepy", mouth:"flat", pattern:"spots", seed:99, hop:0.6}
];

let current = PRESETS[0];

// ---- スライムを描く（設定 → 絵）。ctx は原点が足元中央 ----
function drawSlime(ctx, s, t){
  const R = 52 * s.scale;                 // 基本半径
  // 跳ね: 周期的に小さく跳ぶ。着地でつぶれる
  const hopCycle = (t * 0.45 + s.seed * 0.13) % 1;
  let lift = 0, squash = 1 + Math.sin(t*2.2 + s.seed) * 0.03;
  if (hopCycle < 0.22){
    const p = hopCycle / 0.22;
    lift = Math.sin(p * Math.PI) * 26 * s.hop;
    squash = 1 - Math.sin(p * Math.PI) * 0.10;
  } else if (hopCycle < 0.30){
    const p = (hopCycle - 0.22) / 0.08;
    squash = 1 - Math.sin(p * Math.PI) * 0.13;   // 着地のつぶれ
  }
  const w = R * s.wide * (2 - squash) * 0.5 + R * s.wide * 0.5; // 横は逆位相で少し広がる
  const bodyW = R * s.wide * (1 + (1 - squash) * 0.9);
  const bodyH = R * squash * 1.18;

  ctx.save();
  ctx.translate(0, -lift);
  // 影
  ctx.save();
  ctx.translate(0, lift);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(0, 4, bodyW*0.75*(1 - lift/160), 7, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 体: ドーム型の blob
  const path = new Path2D();
  path.moveTo(-bodyW, 0);
  path.bezierCurveTo(-bodyW, -bodyH*1.05, -bodyW*0.45, -bodyH*1.28, 0, -bodyH*1.28);
  path.bezierCurveTo(bodyW*0.45, -bodyH*1.28, bodyW, -bodyH*1.05, bodyW, 0);
  path.closePath();
  ctx.fillStyle = s.color;
  ctx.fill(path);

  ctx.save();
  ctx.clip(path);
  // お腹（下部の明るい部分）
  ctx.fillStyle = s.belly;
  ctx.beginPath(); ctx.ellipse(0, -bodyH*0.18, bodyW*0.62, bodyH*0.42, 0, 0, Math.PI*2); ctx.fill();
  // 模様
  const rnd = mulberry32(s.seed * 1000 + 17);
  if (s.pattern === "spots"){
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i=0;i<7;i++){
      const a = rnd()*Math.PI*2, d = rnd()*0.55;
      const x = Math.cos(a)*bodyW*d, y = -bodyH*(0.35 + rnd()*0.6);
      ctx.beginPath(); ctx.arc(x, y, 3 + rnd()*5, 0, Math.PI*2); ctx.fill();
    }
  } else if (s.pattern === "stripes"){
    ctx.fillStyle = "rgba(255,255,255,0.20)";
    for (let i=0;i<3;i++){
      const y = -bodyH*(0.45 + i*0.22);
      ctx.fillRect(-bodyW, y, bodyW*2, bodyH*0.07);
    }
  }
  // ハイライト
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.beginPath(); ctx.ellipse(-bodyW*0.38, -bodyH*0.92, bodyW*0.16, bodyH*0.10, -0.5, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // 目: キョロキョロ＋まばたき
  const wander = Math.sin(t*0.6 + s.seed) > 0.3 ? 1 : (Math.sin(t*0.23 + s.seed*2) > 0.4 ? -1 : 0);
  const blink = ((t + s.seed*0.7) % 3.1) > 2.95 ? 0.08 : 1;
  const eyeY = -bodyH*0.72, eyeDX = bodyW*0.34, eyeR = R*0.11;
  ctx.fillStyle = "#14202e";
  for (const side of [-1, 1]){
    const ex = side*eyeDX + wander*eyeR*0.7;
    if (s.eye === "happy"){
      ctx.strokeStyle = "#14202e"; ctx.lineWidth = eyeR*0.55; ctx.lineCap="round";
      ctx.beginPath(); ctx.arc(ex, eyeY + eyeR*0.4, eyeR*0.95, Math.PI*1.08, Math.PI*1.92); ctx.stroke();
    } else if (s.eye === "sleepy"){
      ctx.strokeStyle = "#14202e"; ctx.lineWidth = eyeR*0.55; ctx.lineCap="round";
      ctx.beginPath(); ctx.arc(ex, eyeY - eyeR*0.3, eyeR*0.95, Math.PI*0.08, Math.PI*0.92); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.ellipse(ex, eyeY, eyeR*0.78, eyeR*blink, 0, 0, Math.PI*2); ctx.fill();
      if (blink > 0.5){
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.arc(ex - eyeR*0.25 + wander, eyeY - eyeR*0.3, eyeR*0.28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#14202e";
      }
    }
  }
  // 口
  const mY = -bodyH*0.45;
  ctx.strokeStyle = "#14202e"; ctx.lineWidth = R*0.045; ctx.lineCap = "round";
  if (s.mouth === "smile"){
    ctx.beginPath(); ctx.arc(0, mY - R*0.06, R*0.16, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
  } else if (s.mouth === "o"){
    ctx.beginPath(); ctx.arc(0, mY, R*0.09, 0, Math.PI*2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-R*0.12, mY); ctx.lineTo(R*0.12, mY); ctx.stroke();
  }
  // 名前
  ctx.fillStyle = "#8fa5cc"; ctx.font = "12px system-ui"; ctx.textAlign = "center";
  ctx.fillText(s.name, 0, 22);
  ctx.restore();
}

// ---- 画面ループ ----
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
function frame(ms){
  const t = ms/1000;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = "#16233f";
  ctx.fillRect(0, 300, cv.width, 2);
  drawSlimeAt(210, 300, current, t);
  // プリセット全員も小さい舞台に並べる
  PRESETS.forEach((p, i)=>{ drawSlimeAt(430 + i*105, 300, {...p, scale: p.scale*0.42, name:""}, t); });
  requestAnimationFrame(frame);
}
function drawSlimeAt(x, y, s, t){ ctx.save(); ctx.translate(x, y); drawSlime(ctx, s, t); ctx.restore(); }
requestAnimationFrame(frame);

// ---- UI ----
const ta = document.getElementById("settings");
const err = document.getElementById("err");
function showSettings(){ ta.value = JSON.stringify(current, null, 2); }

// このスライムのURL（設定を base64 でURLに載せる。音楽データプレイヤーと同じ方式）
const urlInput = document.getElementById("slimeUrl");
function encodePayload(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decodePayload(s){
  return JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,"+").replace(/_/g,"/")))));
}
function makerBase(){
  return location.protocol.startsWith("http") ? location.href.split(/[?#]/)[0] : "https://oosawak.github.io/bakudanslim/slime-maker/";
}
function updateUrl(){ urlInput.value = makerBase() + "?s=" + encodePayload(current); }
document.getElementById("copyUrl").onclick = ()=>{
  urlInput.select();
  if (navigator.clipboard) navigator.clipboard.writeText(urlInput.value);
  else document.execCommand("copy");
};
// URLで開かれたら、そのスライムを再現する
{
  const m = location.search.match(/[?&]s=([A-Za-z0-9\-_]+)/);
  if (m){ try { current = {...PRESETS[0], ...decodePayload(m[1])}; } catch(e){} }
}
showSettings(); updateUrl();
const presetDiv = document.getElementById("presets");
PRESETS.forEach(p=>{
  const b = document.createElement("button");
  b.textContent = p.name;
  b.onclick = ()=>{ current = p; showSettings(); updateUrl(); err.textContent=""; };
  presetDiv.appendChild(b);
});
document.getElementById("apply").onclick = ()=>{
  try {
    const v = JSON.parse(ta.value);
    current = {...PRESETS[0], ...v};
    err.textContent = "";
    updateUrl();
  } catch(e){ err.textContent = "設定テキストの読み取りに失敗: " + e.message; }
};
</script>
</body>
</html>
